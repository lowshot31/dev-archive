<template>
    <header class={headerClass}>
        <div class="container slds-p-horizontal_medium">
            <div class="header-inner">
                <a href="javascript:void(0);" onclick={navigateToHome} class="logo">
                     <img src="/sfsites/c/file-asset/pre_logo" alt="Pre 로고">
                </a>

                <nav class={navClass}>
                    <ul class="nav-list">
                        <li><a href="javascript:void(0);" onclick={navigateToHome} class="nav-link">Dashboard</a></li>
                        <li><a href="javascript:void(0);" onclick={navigateToOrder} class="nav-link">Orders</a></li>
                        <li><a href="javascript:void(0);" onclick={navigateToSupport} class="nav-link">Support</a></li>
                    </ul>
                    
                    <div class="user-container">
                        <template lwc:if={userName}>
                            <span class="user-name">{userName}</span>
                        </template>
                        <a href="javascript:void(0);" onclick={handleLogout} class="btn-logout">Logout</a>
                    </div>
                </nav>

                <button class={menuToggleClass} aria-label="메뉴 열기" onclick={toggleMenu}>
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>
</template>
