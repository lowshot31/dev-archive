<template>
    <div class="modal-overlay">
        <div class="modal-container">
            <!-- Header -->
            <div class="modal-header">
                <h2 class="modal-title">새 주문 접수</h2>
                <button class="close-button" onclick={handleCancel}>
                    <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                </button>
            </div>

            <!-- Form Content -->
            <div class="modal-body">
                <lightning-spinner if:true={isLoading} alternative-text="처리 중..." size="medium"></lightning-spinner>

                <div class="slds-form slds-p-around_medium">
                    <!-- 계약서 선택 (선택사항) -->
                    <div class="slds-form-element slds-m-bottom_small">
                        <label class="custom-label">계약서 (선택)</label>
                        <lightning-combobox
                            name="contract"
                            placeholder="계약서 선택 (선택사항)"
                            options={contractOptions}
                            value={selectedContractId}
                            onchange={handleContractChange}>
                        </lightning-combobox>
                    </div>

                    <!-- 주문 일자 -->
                    <div class="slds-form-element slds-m-bottom_small">
                        <label class="custom-label">주문 일자</label>
                        <lightning-input
                            type="date"
                            name="effectiveDate"
                            value={effectiveDate}
                            onchange={handleDateChange}
                            required>
                        </lightning-input>
                    </div>

                    <!-- 주문 설명 -->
                    <div class="slds-form-element slds-m-bottom_small">
                        <label class="custom-label">주문 내용</label>
                        <lightning-textarea
                            name="description"
                            placeholder="주문 내용을 입력하세요"
                            value={description}
                            onchange={handleDescriptionChange}
                            rows="3">
                        </lightning-textarea>
                    </div>

                    <!-- 상품 선택 -->
                    <div class="slds-form-element slds-m-top_medium">
                        <label class="custom-label">상품 선택 *</label>
                        <div class="product-list">
                            <template if:true={products.length}>
                                <table class="product-table">
                                    <thead>
                                        <tr>
                                            <th>선택</th>
                                            <th>상품명</th>
                                            <th>단가</th>
                                            <th>수량</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={products} for:item="product">
                                            <tr key={product.id}>
                                                <td>
                                                    <input 
                                                        type="checkbox" 
                                                        data-id={product.id}
                                                        checked={product.selected}
                                                        onchange={handleProductSelect}
                                                    />
                                                </td>
                                                <td>{product.name}</td>
                                                <td>{product.unitPrice}원</td>
                                                <td>
                                                    <input 
                                                        type="number" 
                                                        class="quantity-input"
                                                        data-id={product.id}
                                                        value={product.quantity}
                                                        onchange={handleQuantityChange}
                                                        min="1"
                                                    />
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>
                            <template if:false={products.length}>
                                <p class="no-products">계약서를 선택하면 상품 목록이 표시됩니다.</p>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <button class="btn btn-cancel" onclick={handleCancel}>취소</button>
                <button class="btn btn-submit" onclick={handleSubmit}>주문 접수</button>
            </div>
        </div>
    </div>
</template>
