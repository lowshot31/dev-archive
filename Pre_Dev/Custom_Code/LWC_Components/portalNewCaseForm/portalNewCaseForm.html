<template>
    <div class="case-form-container">
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="업로드 중..." size="medium"></lightning-spinner>
        </template>
        <lightning-record-edit-form
            object-api-name="Case"
            onsuccess={handleSuccess}
            onerror={handleError}
            onsubmit={handleSubmit}>
            
            <lightning-messages></lightning-messages>

            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                    <label class="custom-label">제목</label>
                    <lightning-input-field field-name="Subject" variant="label-hidden" required></lightning-input-field>
                </div>
                
                <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                    <label class="custom-label">우선순위</label>
                    <lightning-input-field field-name="Priority" variant="label-hidden"></lightning-input-field>
                </div>

                <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                    <label class="custom-label">문의 유형</label>
                    <lightning-input-field field-name="Reason" variant="label-hidden"></lightning-input-field>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                    <label class="custom-label">상세 내용</label>
                    <lightning-input-field field-name="Description" variant="label-hidden" required></lightning-input-field>
                </div>
            </div>

            <div class="slds-m-vertical_medium attachment-section">
                <label class="custom-label">파일 첨부 (선택 사항)</label>
                <div class="file-input-wrapper">
                    <input type="file" onchange={handleFileChange} multiple class="slds-file-selector__input" id="file-input">
                    <label class="slds-file-selector__body" for="file-input">
                        <span class="slds-file-selector__button slds-button slds-button_neutral">
                            <lightning-icon icon-name="utility:upload" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                            파일 선택
                        </span>
                    </label>
                </div>
                
                <template lwc:if={selectedFiles.length}>
                    <ul class="slds-m-top_small selected-files-list">
                        <template for:each={selectedFiles} for:item="file">
                            <li key={file.name} class="slds-p-vertical_xx-small file-item">
                                <lightning-icon icon-name="doctype:attachment" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                                {file.name} ({file.sizeText})
                            </li>
                        </template>
                    </ul>
                </template>
            </div>

            <div class="slds-m-top_medium footer-actions">
                <lightning-button label="취소" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
                <button type="submit" class="btn-submit">문의 접수하기</button>
            </div>
        </lightning-record-edit-form>
    </div>
</template>
