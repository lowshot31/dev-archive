<template>
    <div class="case-form-container">
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="업로드 중..." size="medium"></lightning-spinner>
        </template>
        
        <h2 class="form-title">새 문의 접수</h2>
        
        <div class="slds-form slds-p-around_medium">
            <!-- 제목 -->
            <div class="form-field">
                <label class="custom-label">제목 *</label>
                <lightning-input
                    name="subject"
                    value={subject}
                    onchange={handleSubjectChange}
                    required>
                </lightning-input>
            </div>

            <!-- 문의 유형 -->
            <div class="form-field">
                <label class="custom-label">문의 유형</label>
                <lightning-combobox
                    name="reason"
                    value={reason}
                    placeholder="문의 유형 선택"
                    options={reasonOptions}
                    onchange={handleReasonChange}>
                </lightning-combobox>
            </div>

            <!-- 상세 내용 -->
            <div class="form-field">
                <label class="custom-label">상세 내용 *</label>
                <lightning-textarea
                    name="description"
                    value={description}
                    placeholder="상세 내용을 입력하세요"
                    onchange={handleDescriptionChange}
                    rows="4"
                    required>
                </lightning-textarea>
            </div>

            <!-- 이슈 발생일 -->
            <div class="form-field">
                <label class="custom-label">이슈 발생일</label>
                <lightning-input
                    type="date"
                    name="issueDate"
                    value={issueDate}
                    onchange={handleIssueDateChange}>
                </lightning-input>
            </div>

            <!-- 관련 제품 -->
            <div class="form-field">
                <label class="custom-label">관련 제품</label>
                <lightning-combobox
                    name="product"
                    value={selectedProductId}
                    placeholder="이슈 관련 제품 선택"
                    options={productOptions}
                    onchange={handleProductChange}>
                </lightning-combobox>
            </div>

            <!-- 파일 첨부 -->
            <div class="attachment-section">
                <label class="custom-label">파일 첨부 (선택 사항, 대용량 지원)</label>
                <div class="file-input-wrapper">
                    <input type="file" onchange={handleFileChange} multiple id="file-input">
                    <label class="file-upload-label" for="file-input">
                        <lightning-icon icon-name="utility:upload" size="x-small"></lightning-icon>
                        <span>파일 선택</span>
                    </label>
                </div>
                
                <template lwc:if={selectedFiles.length}>
                    <ul class="selected-files-list">
                        <template for:each={selectedFiles} for:item="file">
                            <li key={file.name} class="file-item">
                                <lightning-icon icon-name="doctype:attachment" size="xx-small"></lightning-icon>
                                <span>{file.name} ({file.sizeText})</span>
                            </li>
                        </template>
                    </ul>
                </template>
            </div>

            <!-- Footer -->
            <div class="footer-actions">
                <lightning-button label="취소" onclick={handleCancel} variant="neutral"></lightning-button>
                <button class="btn-submit" onclick={handleSubmit}>문의 접수하기</button>
            </div>
        </div>
    </div>
</template>
