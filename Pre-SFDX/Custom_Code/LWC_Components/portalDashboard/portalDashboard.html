<template>
    <div class="main-content slds-p-around_medium">
        <lightning-card title="Portal Dashboard" icon-name="standard:account">
            <!-- Header Actions (Dashboard Only) -->
            <div slot="actions">
                <template lwc:if={showNewOrderButton}>
                    <lightning-button label="New Order" onclick={handleOpenModal} variant="brand"></lightning-button>
                </template>
                <template lwc:if={showNewCaseButton}>
                    <lightning-button label="New Case" onclick={handleCreateCase} variant="brand"></lightning-button>
                </template>
            </div>
            
            <div class="slds-p-around_medium">
                <!-- Case Detail View -->
                <template lwc:if={isCaseDetailView}>
                    <c-portal-case-detail
                        case-id={selectedCase.Id}
                        case-subject={selectedCase.Subject}
                        case-status={selectedCase.Status}
                        case-number={selectedCase.CaseNumber}
                        case-priority={selectedCase.Priority}
                        case-created-date={selectedCase.CreatedDate}
                        onback={handleBackToDashboard}>
                    </c-portal-case-detail>
                </template>

                <!-- Dashboard View -->
                <template lwc:if={isDashboardView}>
                    <template lwc:if={isLoading}>
                        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    </template>

                    <lightning-tabset active-tab-value={activeTab}>
                        <!-- Overview Tab -->
                        <lightning-tab label="Overview" value="overview" onactive={handleTabActive}>
                            <div class="slds-grid slds-gutters slds-wrap">
                                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                                    <h3 class="slds-text-heading_small slds-m-bottom_small">Recent Orders</h3>
                                    <template lwc:if={orders.length}>
                                        <lightning-datatable
                                            key-field="Id"
                                            data={visibleOrdersSummary}
                                            columns={orderColumns}
                                            hide-checkbox-column>
                                        </lightning-datatable>
                                    </template>
                                    <template lwc:else>
                                        <p>No recent orders.</p>
                                    </template>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                                    <h3 class="slds-text-heading_small slds-m-bottom_small">Recent Cases</h3>
                                    <template lwc:if={cases.length}>
                                        <lightning-datatable
                                            key-field="Id"
                                            data={visibleCasesSummary}
                                            columns={caseColumns}
                                            hide-checkbox-column
                                            onrowaction={handleRowAction}>
                                        </lightning-datatable>
                                    </template>
                                    <template lwc:else>
                                        <p>No recent cases.</p>
                                    </template>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                                    <h3 class="slds-text-heading_small slds-m-bottom_small">Recent Contracts</h3>
                                    <template lwc:if={contracts.length}>
                                        <lightning-datatable
                                            key-field="Id"
                                            data={visibleContractsSummary}
                                            columns={contractColumns}
                                            hide-checkbox-column>
                                        </lightning-datatable>
                                    </template>
                                    <template lwc:else>
                                        <p>No recent contracts.</p>
                                    </template>
                                </div>
                            </div>
                        </lightning-tab>

                        <lightning-tab label="Orders" value="orders" onactive={handleTabActive}>
                            <template lwc:if={orderState.visibleData.length}>
                                <lightning-datatable
                                    key-field="Id"
                                    data={orderState.visibleData}
                                    columns={orderColumns}
                                    hide-checkbox-column>
                                </lightning-datatable>
                                <!-- Pagination Controls -->
                                <div class="slds-m-top_medium slds-align_absolute-center">
                                    <lightning-button-group>
                                        <lightning-button label="Previous" onclick={handlePrev} data-type="order" disabled={orderState.disablePrev}></lightning-button>
                                        <lightning-button label={orderState.currentPage} variant="base" class="slds-p-horizontal_small" disabled></lightning-button>
                                        <lightning-button label="Next" onclick={handleNext} data-type="order" disabled={orderState.disableNext}></lightning-button>
                                    </lightning-button-group>
                                </div>
                            </template>
                            <template lwc:else>
                                <p class="slds-p-around_medium">No orders found.</p>
                            </template>
                        </lightning-tab>

                        <lightning-tab label="Cases" value="cases" onactive={handleTabActive}>
                            <template lwc:if={caseState.visibleData.length}>
                                <lightning-datatable
                                    key-field="Id"
                                    data={caseState.visibleData}
                                    columns={caseColumns}
                                    hide-checkbox-column
                                    onrowaction={handleRowAction}>
                                </lightning-datatable>
                                <!-- Pagination Controls -->
                                <div class="slds-m-top_medium slds-align_absolute-center">
                                    <lightning-button-group>
                                        <lightning-button label="Previous" onclick={handlePrev} data-type="case" disabled={caseState.disablePrev}></lightning-button>
                                        <lightning-button label={caseState.currentPage} variant="base" class="slds-p-horizontal_small" disabled></lightning-button>
                                        <lightning-button label="Next" onclick={handleNext} data-type="case" disabled={caseState.disableNext}></lightning-button>
                                    </lightning-button-group>
                                </div>
                            </template>
                            <template lwc:else>
                                <p class="slds-p-around_medium">No cases found.</p>
                            </template>
                        </lightning-tab>

                        <lightning-tab label="Contracts" value="contracts" onactive={handleTabActive}>
                            <template lwc:if={contractState.visibleData.length}>
                                <lightning-datatable
                                    key-field="Id"
                                    data={contractState.visibleData}
                                    columns={contractColumns}
                                    hide-checkbox-column>
                                </lightning-datatable>
                                <!-- Pagination Controls -->
                                <div class="slds-m-top_medium slds-align_absolute-center">
                                    <lightning-button-group>
                                        <lightning-button label="Previous" onclick={handlePrev} data-type="contract" disabled={contractState.disablePrev}></lightning-button>
                                        <lightning-button label={contractState.currentPage} variant="base" class="slds-p-horizontal_small" disabled></lightning-button>
                                        <lightning-button label="Next" onclick={handleNext} data-type="contract" disabled={contractState.disableNext}></lightning-button>
                                    </lightning-button-group>
                                </div>
                            </template>
                            <template lwc:else>
                                <p class="slds-p-around_medium">No contracts found.</p>
                            </template>
                        </lightning-tab>
                    </lightning-tabset>
                </template>
            </div>
        </lightning-card>
    </div>

    <!-- Create Order Modal -->
    <template lwc:if={showModal}>
        <c-portal-new-order-form
            account-id={recordId}
            onsuccess={handleOrderSuccess}
            oncancel={handleCloseModal}>
        </c-portal-new-order-form>
    </template>
    
    <!-- Create Case Modal -->
    <template lwc:if={showCaseModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseCaseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">새 문의 접수</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <c-portal-new-case-form
                        account-id={recordId}
                        onsuccess={handleCaseSuccess}
                        oncancel={handleCloseCaseModal}>
                    </c-portal-new-case-form>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
