[project]
name = "pre-homepage"
version = "0.1.0"
description = "Pre Dairy Company Homepage - FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
dev = "uvicorn app:app --reload --host 0.0.0.0 --port 8000"

[tool.uv]
dev-dependencies = [
    "httpx>=0.27.0",
]
