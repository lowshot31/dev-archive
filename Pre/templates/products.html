{% extends "base.html" %}

{% block content %}
<!-- Page Header -->
<section class="page-header">
    <div class="container">
        <h1>제품 소개</h1>
        <p>Pre의 다양한 유기농 유제품을 만나보세요</p>
    </div>
</section>

<!-- Products Section -->
<section class="section products">
    <div class="container">
        <!-- Category Filter -->
        <div class="category-filter">
            <button class="category-btn active" data-filter="all">전체</button>
            <button class="category-btn" data-filter="organic">유기농</button>
            <button class="category-btn" data-filter="lowfat">저지방</button>
            <button class="category-btn" data-filter="lactofree">락토프리</button>
            <button class="category-btn" data-filter="premium">프리미엄</button>
            <button class="category-btn" data-filter="other">치즈 & 버터</button>
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Products will be dynamically loaded by JavaScript -->
        </div>
    </div>
</section>

<!-- CTA -->
<section class="section cta">
    <div class="container">
        <h2>대량 구매 및 거래처 문의</h2>
        <p>학교, 기업, 카페 등 도매 거래를 원하시면 견적을 요청해주세요</p>
        <div class="cta-buttons">
            <a href="{{ url_for('contact') }}" class="btn btn-primary">견적 문의</a>
            <a href="{{ url_for('support') }}" class="btn btn-outline">고객 센터</a>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', path='js/products.js') }}"></script>
{% endblock %}
