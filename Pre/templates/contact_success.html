{% extends "base.html" %}

{% block extra_css %}
<style>
    .success-container {
        max-width: 600px;
        margin: 100px auto;
        text-align: center;
        padding: var(--space-2xl);
        background: var(--color-white);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
    }

    .success-icon {
        width: 80px;
        height: 80px;
        background: var(--color-success-light, #e6f4ea);
        color: var(--color-success, #1e8e3e);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        margin: 0 auto var(--space-lg);
    }

    .success-title {
        color: var(--color-text);
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: var(--space-sm);
    }

    .success-message {
        color: var(--color-text-light);
        margin-bottom: var(--space-xl);
        line-height: 1.6;
        font-size: 1.1rem;
    }

    .btn-home {
        background: var(--color-primary);
        color: white;
        padding: var(--space-md) var(--space-xl);
        border-radius: var(--radius-md);
        text-decoration: none;
        display: inline-block;
        font-weight: 500;
        transition: background 0.2s;
    }

    .btn-home:hover {
        background: var(--color-primary-dark);
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="success-container">
        <div class="success-icon">✓</div>
        <h1 class="success-title">문의가 접수되었습니다</h1>
        <p class="success-message">
            견적 문의가 성공적으로 접수되었습니다.<br>
            담당자가 내용을 확인한 후 1-2일 이내에 연락드리겠습니다.<br>
            저희 Pre 제품에 관심을 가져주셔서 감사합니다.
        </p>
        <a href="/" class="btn-home">메인으로 돌아가기</a>
    </div>
</div>
{% endblock %}
